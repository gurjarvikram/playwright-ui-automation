name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A nightly run against production catches breakage that comes from the application or the
  # environment rather than from a commit — which no push-triggered pipeline can see.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression (e.g. "@login or @product"). Empty runs everything.'
        required: false
        default: ''
      workers:
        description: 'Parallel cucumber workers per job'
        required: false
        default: '4'

# Superseded runs on the same branch or PR are pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 20 reached end of life in April 2026. 22 is the current LTS and the floor for the
  # toolchain: @cucumber/cucumber 13, ESLint 10 and faker 10 all refuse to run below it.
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------------
  # Gate 1 — static checks. Seconds, no browser, no network to the site under test.
  # A lint error should never cost a full browser matrix to discover.
  # ---------------------------------------------------------------------------------
  quality:
    name: Lint, format and step validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # A dry run resolves every Gherkin step against the step definitions without opening a
      # browser. It catches an undefined or ambiguous step in about a second, which would
      # otherwise surface as a mid-suite failure minutes into the matrix.
      - name: Validate step definitions
        run: npm run validate:steps

      - name: Audit production dependencies
        # Advisory only: a new advisory against a transitive dependency should be visible on
        # the PR, but it must not block a merge that has nothing to do with it.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------------
  # Gate 2 — smoke. The critical path in one browser. Fails fast on a broken build.
  # ---------------------------------------------------------------------------------
  smoke:
    name: Smoke (chromium)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version, not the lockfile hash: browsers are tied to the
          # Playwright build, so an unrelated dependency bump must not evict them.
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:smoke
        env:
          CI: true
          BROWSER: chromium
          HEADLESS: true
          CUCUMBER_WORKERS: ${{ inputs.workers || '4' }}
          SAUCE_BASE_URL: ${{ secrets.SAUCE_BASE_URL }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      - name: Upload smoke failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-smoke
          path: artifacts
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # Gate 3 — full regression across every supported engine.
  # ---------------------------------------------------------------------------------
  regression:
    name: Regression (${{ matrix.browser }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One engine failing is a finding about that engine, not a reason to abandon the
      # evidence the other two are still producing.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      # --with-deps installs the system libraries the engine needs. WebKit in particular
      # will not launch on a bare ubuntu runner without them.
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression suite
        run: npm test
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
          VIDEO: retain-on-failure
          TRACE: retain-on-failure
          CUCUMBER_WORKERS: ${{ inputs.workers || '4' }}
          CUCUMBER_TAGS: ${{ inputs.tags || '' }}
          SAUCE_BASE_URL: ${{ secrets.SAUCE_BASE_URL }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Raw results, one artefact per engine — they are merged into a single report below.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.browser }}
          path: artifacts
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # One Allure report covering all three engines, with trend history carried between runs.
  # ---------------------------------------------------------------------------------
  report:
    name: Allure report
    needs: regression
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # allure-commandline is a JVM tool. ubuntu-latest ships a JDK today, but that is not
      # contractual — pin it so report generation cannot break under us.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Collect results from every engine
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: merged-results
          merge-multiple: true

      # Allure renders the trend graph from the previous report's history folder. Without
      # this the report is a snapshot and "is this getting better or worse" is unanswerable.
      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Seed history into results
        run: |
          mkdir -p merged-results
          if [ -d allure-history ]; then cp -r allure-history merged-results/history || true; fi

      - name: Generate report
        run: npx allure generate merged-results --clean -o allure-report

      - name: Save history for the next run
        run: rm -rf allure-history && cp -r allure-report/history allure-history || true

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
          if-no-files-found: warn
