name: Playwright BDD Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression (e.g. "@login or @product"). Empty runs everything.'
        required: false
        default: ''
      workers:
        description: 'Number of parallel cucumber workers'
        required: false
        default: '4'

# Superseded runs on the same branch/PR are pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CUCUMBER_WORKERS: ${{ inputs.workers || '4' }}
  CUCUMBER_TAGS: ${{ inputs.tags || '' }}

jobs:
  test:
    name: BDD suite (parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # allure-commandline is a JVM tool; ubuntu-latest ships a JDK today but
      # that is not contractual. Pin it so report generation cannot break silently.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run BDD suite
        run: npm test
        env:
          HEADLESS: true
          CI: true
          CUCUMBER_WORKERS: ${{ env.CUCUMBER_WORKERS }}
          CUCUMBER_TAGS: ${{ env.CUCUMBER_TAGS }}
          SAUCE_BASE_URL: ${{ secrets.SAUCE_BASE_URL }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Raw results are what you need to re-generate or merge a report locally.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
          if-no-files-found: warn

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run report:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
          if-no-files-found: warn
