version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # @types/node describes the runtime, so it must track the Node major the suite runs on
      # (22 — see .nvmrc and engines), not the newest published types. Ahead of the runtime it
      # autocompletes APIs that do not exist at run time. Raise this with the Node floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    groups:
      # Playwright's library and test packages share a version and must move together —
      # split across two PRs they would each fail CI until both merged.
      playwright:
        patterns: ['playwright', '@playwright/*']
      cucumber:
        patterns: ['@cucumber/*', 'allure-cucumberjs']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'prettier*', 'globals']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: [dependencies, ci]
