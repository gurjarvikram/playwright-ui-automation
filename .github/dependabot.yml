version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    # Monthly, not weekly: a portfolio repo wants dependencies that are demonstrably
    # current, not a standing queue of one-line PRs to triage.
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies]
    ignore:
      # @types/node describes the runtime, so it must track the Node major the suite runs on
      # (22 — see .nvmrc and engines), not the newest published types. Ahead of the runtime it
      # autocompletes APIs that do not exist at run time. Raise this with the Node floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    groups:
      # One PR for everything. This subsumes the old playwright/cucumber/tooling groups —
      # `playwright` and `@playwright/*` share a version and must move together, and split
      # across two PRs they would each fail CI until both merged. A catch-all guarantees it.
      # The cost is that one failing bump holds up the rest; when that happens, drop the
      # offending package into `ignore` rather than ungrouping.
      all-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
